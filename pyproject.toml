[project]
name = "edgeppe"
version = "0.1.0"
description = "Real-time PPE compliance monitor on CPU: YOLO11, ByteTrack, ONNX/OpenVINO/INT8"
readme = "README.md"
authors = [
    { name = "Maliki Moustapha", email = "ayindemalik1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nncf>=3.4.0",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "onnxslim>=0.1.96",
    "openvino>=2026.4.0",
    "pandas>=3.0.6",
    "tabulate>=0.10.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "typer>=0.27.2",
    "ultralytics>=8.4.158",
]

[project.scripts]
edgeppe = "edgeppe:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

# PyTorch from the CPU-only index: about 200 MB instead of 2.5 GB with CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

